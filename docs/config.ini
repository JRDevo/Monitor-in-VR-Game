# Monitor in VR Game -- settings. Saved changes apply while the game runs (read again within ~1 s), except `apps` and `log`.
# A line starting with # is a comment. A bad value is written to the log and the default is used.

# Which monitor to show:
#   primary      the Windows main display
#   2            the 2nd monitor in the log's list ("capture: monitor 2: ..."); NOT Windows' own "Display 2" number
#   DISPLAY3     any part of a monitor's name, its \\.\DISPLAYn name or its GPU's name (the first that matches)
#   1, 3         SEVERAL panels, one per monitor in the list (up to 8; any of the forms above, split by commas)
#                (in VR: settings > Screen > Screens - / + adds or removes a panel and writes the list here)
#   all          one panel for EVERY monitor, left to right as on your desk (a monitor plugged in later gets one too)
# A virtual monitor (Apollo / Sunshine's virtual display, a virtual display driver) is a monitor like any other here.
# One panel: cycle_key (below) changes it in the game and writes the new number here. Several: cycle_key hides / shows all.
monitor = primary

# Where the panel floats: x, y, z, yaw, pitch, width[, roll]
#   x / y / z  metres (space = game: the game's own VR space, the panel stays fixed in the cab; space = local: the room's)
#   yaw        degrees, + = turned left;  pitch  degrees, + = tilted up;  roll  degrees, + = twisted left (optional)
#   width      metres (the height follows the monitor's shape)
# Empty: low and to the right in front of where your head is at the start (0.3 m right, 0.2 m down, 0.75 m ahead, 0.6 m wide).
# The log then shows that place as a "place = ..." line you can paste here and adjust.
# You move it in VR with a controller (below) and it is written here.
# Several panels: place2, place3 ... are the 2nd, 3rd ... panel's own lines (empty / missing: side by side in a row round you).
place =

# local (the room's space: the controllers can move the panel, see below) or game (the game's own VR space, the panel stays
# fixed in the game's world, e.g. a cab; the VR controls below are off then)
space = local

# VR controls (space = local; no other mod needed: the layer reads the controllers itself, next to the game's own input).
# The PICTURE takes nothing: pointing shows a dot, a click or a grip there is the game's. REST the pointer on the picture for open_dwell seconds (a ring round the
# dot fills up): the bars (4 s away: the auto-hide ones hide). While the bars are open, GRIP on the panel or a bar: the
# panel follows the hand; its stick up / down = farther / closer. Settings (the cog): tab Screen
# (opacity, size, distance, tilt / turn / roll + Level, monitor, screen off), tab Bars (which button on which bar). All
# written here.
#   bar_top / bar_bottom / bar_left / bar_right   the buttons on each bar, in any order (they show in a fixed order):
#        lock, smaller, bigger, monitor, power, previous, play, next, volume_down, mute, volume_up, game_volume_down,
#        game_volume_up, help, settings  (game_volume_*: the GAME's own sound -- settings > Sound has both as sliders)
#        (a button on no bar is hidden). Media: play / skip = the PC's media session; volume = the media app's own sound
#        only, never the game's.
#   bar_<x>_auto   1 = that bar hides until the picture is clicked; 0 = always shown
#   lock     1 = the panel cannot be moved, pushed or resized from VR (the padlock)
#   open_dwell     seconds the pointer rests on the picture to open the bars (0.5 .. 10)
bar_top = lock, smaller, bigger, monitor, help, settings
bar_bottom = previous, play, next, volume_down, mute, volume_up
bar_left =
bar_right =
bar_top_auto = 1
bar_bottom_auto = 1
bar_left_auto = 1
bar_right_auto = 1
lock = 0
open_dwell = 3
# ? on the bar = a short help page.

# Panel width in pixels, the most (0 = the monitor's own width, never more anyway). With auto_resolution = 1 the picture's
# width follows the panel's size in the headset: picture_density pixels per degree (60 = about 2 x a Quest 3: sharp desktop
# text; the log says what it picked). picture_density is also used for the bars and the settings.
resolution = 0
auto_resolution = 1
picture_density = 60

# 0.05 .. 1 (1 = solid)
opacity = 1

# The picture's soft edge and rounded corners, in % of its shorter side (0 .. 25; 0 = a hard edge / square corners)
edge_fade = 4
corner_radius = 3

# At most this many new pictures a second (1 .. 240). A still desktop sends none at all; a small change (a caret, a clock:
# under 0.5 % of the monitor) at most 15 a second.
fps_cap = 60

# 1 = shown when the game starts (and whenever this line changes), 0 = hidden
show = 1

# One key cycles the panel: hidden -> monitor 1 -> monitor 2 -> ... -> monitor N -> hidden -> monitor 1 ...
# One step per press, only while the game's window is in front. From hidden it always goes to monitor 1. On each step it shows
# "Monitor 2 / 3 -- \\.\DISPLAY2, 2560x1440" on the panel for 2 s and writes `show` and `monitor` above. "none" = no key.
# Read by polling: the key is not taken from the game. Avoid: Delete, arrows, Ctrl / Shift / Alt + F10..F12 (DLAA mod),
# ScrollLock, Alt + a key (VR EyeCapture), Pause, Space.
cycle_key = Backslash

# monitor = a desktop monitor; pattern = a moving test picture (no monitor needed; for testing)
source = monitor

# The programs the layer works in (exe names, comma separated, e.g. mygame.exe, other.exe; * = every OpenXR
# program). Read at game start.
apps = *

# 1 = the VR controls read the controllers (the layer's own OpenXR action set, added next to the game's; while you point at
# a bar or hold the panel, the game does not see that hand's trigger / grip / stick). 0 = the layer never touches the
# controllers (the panel and the cycle key still work). Read at game start.
controllers = 1
# The pointer's steadiness: off, low, medium or high (high = a shaky hand calmed most, a little slower to follow)
pointer_smoothing = medium

# 1 = write logs\monitor_in_vr_game.log next to the DLL (the monitors found, problems, cost once a minute). Read at game start.
log = 1

# 1 = ask the VR runtime to supersample our quads (XR_FB_composition_layer_settings, when it offers it). 0 = not asked
# (the default: no extension added to the game's OpenXR instance). Read at game start.
supersample = 0
